# Integracion continua: en cada PR y en cada push a main o desarrollo compila y prueba
# el backend, compila el frontend y construye la imagen Docker. No despliega nada.
name: CI

on:
  pull_request:
    branches: [main, desarrollo]
  push:
    branches: [main, desarrollo]

permissions:
  contents: read

# Cancela la ejecucion anterior de la misma rama cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify corre las pruebas unitarias y de integracion y valida la cobertura minima de JaCoCo.
      # Las pruebas E2E con Selenium (etiqueta e2e) quedan fuera: necesitan Chrome y el frontend en el puerto 4200.
      - name: Pruebas del backend
        run: mvn -B verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      # Solo construye la imagen para comprobar que el Dockerfile funciona; no la publica.
      - run: docker build -t pethaven-backend:ci .
