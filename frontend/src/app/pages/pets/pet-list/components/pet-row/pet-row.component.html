<td class="py-3 px-4">
  <img [src]="pet().photoUrl" [alt]="pet().name" class="h-12 w-12 rounded-full object-cover">
</td>
<td class="py-3 px-4 font-semibold text-text">{{ pet().name }}</td>
<td class="py-3 px-4 text-text/70">{{ pet().species === 'DOG' ? 'Perro' : 'Gato' }}</td>
<td class="py-3 px-4 text-text/70">{{ pet().breed }}</td>
<td class="py-3 px-4 text-text/70">{{ pet().age }} años</td>
<td class="py-3 px-4 text-text/70">{{ pet().weight }} kg</td>
<td class="py-3 px-4">
  <div class="flex items-center gap-3">
    <a [routerLink]="['/pets', pet().id]" class="text-sm font-bold text-olive hover:text-tertiary transition-colors">Ver Ficha</a>
    <span class="text-text/20">|</span>
    <a [routerLink]="['/pets/update', pet().id]" class="text-sm font-bold text-text/60 hover:text-tertiary transition-colors">Editar</a>
    <span class="text-text/20">|</span>
    <button type="button" (click)="onDeleteClick()" class="text-sm font-bold text-red-500 hover:text-red-700 transition-colors cursor-pointer">Eliminar</button>
  </div>
</td>
