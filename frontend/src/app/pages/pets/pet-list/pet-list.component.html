<main class="max-w-6xl mx-auto px-5 lg:px-12 py-12">

  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="font-display text-3xl font-bold text-text">Mascotas</h1>
      <p class="text-text/70">Listado de todas las mascotas registradas en PetHaven.</p>
    </div>
    <a routerLink="/pets/add"
       class="bg-primary text-background px-5 py-2.5 rounded-full font-bold hover:opacity-90 transition-opacity shadow-sm whitespace-nowrap">
      + Nueva mascota
    </a>
  </div>

  <div class="bg-white rounded-3xl overflow-hidden shadow-sm">
    <table class="w-full text-left">
      <thead class="bg-primary text-background">
        <tr>
          <th class="py-3 px-4">Foto</th>
          <th class="py-3 px-4">Nombre</th>
          <th class="py-3 px-4">Especie</th>
          <th class="py-3 px-4">Raza</th>
          <th class="py-3 px-4">Edad</th>
          <th class="py-3 px-4">Peso</th>
          <th class="py-3 px-4"></th>
        </tr>
      </thead>
      <tbody>
        @for (pet of pets(); track pet.id) {
          <tr app-pet-row [pet]="pet" (deletePet)="eliminar($event)"></tr>
        } @empty {
          <tr>
            <td colspan="7" class="py-8 text-center text-text/50">Todavía no hay mascotas registradas.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

</main>
