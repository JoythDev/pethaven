<main class="max-w-3xl mx-auto px-5 lg:px-12 py-12">

  <a routerLink="/pets" class="text-sm font-semibold text-olive hover:text-tertiary transition-colors">
    ← Volver a Mascotas
  </a>

  @if (pet) {
    <div class="bg-white rounded-3xl overflow-hidden shadow-sm mt-6">
      <img [src]="pet.photoUrl" [alt]="pet.name" class="w-full h-64 object-cover">
      <div class="p-8">
        <h1 class="font-display text-3xl font-bold text-text mb-1">{{ pet.name }}</h1>
        <p class="text-text/70 mb-6">{{ pet.species === 'DOG' ? 'Perro' : 'Gato' }} · {{ pet.breed }}</p>

        <dl class="grid grid-cols-2 gap-y-4 text-sm">
          <dt class="text-text/50">Edad</dt>
          <dd class="font-semibold text-text">{{ pet.age }} años</dd>

          <dt class="text-text/50">Peso</dt>
          <dd class="font-semibold text-text">{{ pet.weight }} kg</dd>

          <dt class="text-text/50">Diagnóstico</dt>
          <dd class="font-semibold text-text">{{ pet.disease ?? 'Ninguno' }}</dd>
        </dl>

        <a [routerLink]="['/pets/update', pet.id]"
           class="inline-block mt-8 bg-olive text-background px-6 py-2.5 rounded-full font-bold hover:opacity-90 transition-opacity shadow-sm">
          Editar mascota
        </a>
      </div>
    </div>
  } @else {
    <p class="mt-10 text-center text-text/50">No se encontró ninguna mascota con ese id.</p>
  }

</main>
