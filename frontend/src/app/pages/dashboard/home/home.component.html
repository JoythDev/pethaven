<div class="mx-auto max-w-7xl p-5 lg:p-8">
  <header class="mb-8">
    <h1 class="font-display text-3xl lg:text-4xl font-bold text-text">Panel de PetHaven</h1>
    <p class="mt-1 text-text/70">Gestiona la operación de la clínica desde un solo lugar.</p>
  </header>

  <section class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3" aria-label="Módulos del panel">
    @for (module of modules; track module.label) {
      @if (module.link) {
        <a
          [routerLink]="module.link"
          class="group flex flex-col gap-3 rounded-3xl border border-olive/15 bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-md"
        >
          <div class="flex items-center justify-between">
            <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-secondary">
              <img [src]="module.icon" alt="" class="h-6 w-6" />
            </div>
            <i
              class="pi pi-arrow-right text-olive transition-transform group-hover:translate-x-1"
              aria-hidden="true"
            ></i>
          </div>
          <h2 class="font-display text-lg font-bold text-text">{{ module.label }}</h2>
          <p class="text-sm text-text/70">{{ module.description }}</p>
        </a>
      } @else {
        <article
          class="flex flex-col gap-3 rounded-3xl border border-olive/15 bg-white p-6 shadow-sm opacity-70"
          aria-disabled="true"
        >
          <div class="flex items-center justify-between">
            <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-secondary/60">
              <img [src]="module.icon" alt="" class="h-6 w-6 opacity-70" />
            </div>
            <p-tag value="Próximamente" severity="secondary" />
          </div>
          <h2 class="font-display text-lg font-bold text-text">{{ module.label }}</h2>
          <p class="text-sm text-text/70">{{ module.description }}</p>
        </article>
      }
    }
  </section>
</div>
