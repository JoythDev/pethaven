<div class="mx-auto max-w-3xl p-5 lg:p-8">
  <a routerLink="/dashboard/pets" class="text-sm font-semibold text-olive transition-colors hover:text-tertiary">
    ← Volver a Mascotas
  </a>

  @if (pet(); as p) {
    <div class="mt-6 overflow-hidden rounded-3xl border border-olive/15 bg-white shadow-sm">
      <img [src]="p.photoUrl" [alt]="p.name" class="h-64 w-full object-cover" />
      <div class="p-6 lg:p-8">
        <div class="mb-1 flex flex-wrap items-center gap-3">
          <h1 class="font-display text-3xl font-bold text-text">{{ p.name }}</h1>
          <app-pet-status-tag [pet]="p" />
          <p-tag
            [value]="p.active ? 'Activa' : 'Inactiva'"
            [severity]="p.active ? 'success' : 'secondary'"
          />
        </div>
        <p class="mb-6 text-text/70">{{ p.species === 'DOG' ? 'Perro' : 'Gato' }} · {{ p.breed }}</p>

        <dl class="grid grid-cols-1 gap-y-4 text-sm sm:grid-cols-2">
          <div>
            <dt class="text-text/50">Edad</dt>
            <dd class="font-semibold text-text">{{ p.age }} años</dd>
          </div>
          <div>
            <dt class="text-text/50">Peso</dt>
            <dd class="font-semibold text-text">{{ p.weight }} kg</dd>
          </div>
          <div class="sm:col-span-2">
            <dt class="text-text/50">Dueño</dt>
            <dd class="font-semibold">
              <a
                [routerLink]="['/dashboard/owners', p.ownerId]"
                class="text-olive transition-colors hover:text-tertiary"
              >
                {{ ownerName() }}
              </a>
            </dd>
          </div>
          <div class="sm:col-span-2">
            <dt class="text-text/50">Diagnóstico</dt>
            <dd class="font-semibold text-text">{{ p.disease ?? 'Ninguno' }}</dd>
          </div>
        </dl>

        <p-button class="mt-8" label="Editar mascota" icon="pi pi-pencil" (onClick)="editar(p.id)" />
      </div>
    </div>
  } @else {
    <div class="mt-6 rounded-3xl border border-olive/15 bg-white p-10 text-center shadow-sm">
      <i class="pi pi-search text-2xl text-text/30" aria-hidden="true"></i>
      <p class="mt-3 text-text/60">No se encontró ninguna mascota con ese id.</p>
      <p-button class="mt-4" label="Volver a Mascotas" [outlined]="true" (onClick)="volver()" />
    </div>
  }
</div>
