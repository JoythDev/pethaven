<div class="mx-auto max-w-3xl p-5 lg:p-8">
  <header class="mb-6">
    <h1 class="font-display text-3xl font-bold text-text">Mi Perfil</h1>
    <p class="mt-1 text-text/70">Tus datos de contacto registrados en la clínica.</p>
  </header>

  @let s = state();

  @if (s.status === 'loading') {
    <section class="rounded-3xl border border-olive/15 bg-white p-6 shadow-md lg:p-8" aria-hidden="true">
      <div class="flex items-center gap-4">
        <p-skeleton shape="circle" size="3.5rem" />
        <div class="flex-1">
          <p-skeleton width="40%" height="1.5rem" styleClass="mb-2" />
          <p-skeleton width="60%" />
        </div>
      </div>
      <div class="mt-6 space-y-3">
        <p-skeleton height="1rem" />
        <p-skeleton height="1rem" />
        <p-skeleton height="1rem" />
      </div>
    </section>
  } @else if (s.status === 'ready') {
    @let owner = s.data;
    <section class="overflow-hidden rounded-3xl border border-olive/10 bg-white shadow-lg">
      <div class="relative h-28 overflow-hidden bg-honey">
        <span aria-hidden="true" class="absolute -right-8 -top-12 h-40 w-40 rounded-full bg-white/30"></span>
        <span aria-hidden="true" class="absolute -bottom-12 left-10 h-28 w-28 rounded-full bg-terracotta/30"></span>
      </div>

      <div class="relative px-6 pb-6 lg:px-8 lg:pb-8">
        <p-avatar
          [label]="owner.name.charAt(0).toUpperCase()"
          size="xlarge"
          shape="circle"
          styleClass="-mt-10 shrink-0 bg-secondary font-display font-bold text-tertiary ring-4 ring-white shadow-md"
        />
        <h2 class="mt-3 font-display text-3xl font-bold text-text">{{ owner.name }}</h2>

        <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div app-stat-card layout="tile" color="secondary" label="Documento" [value]="owner.document" valueClass="text-xl"></div>
          <div app-stat-card layout="tile" color="sage" label="Teléfono" [value]="owner.phone" valueClass="text-xl"></div>
          <div app-stat-card class="sm:col-span-2" layout="tile" color="honey" label="Correo" [value]="owner.email" valueClass="break-words text-xl"></div>
        </div>

        <p-button
          class="mt-8 block"
          label="Cerrar sesión"
          icon="pi pi-sign-out"
          severity="secondary"
          [outlined]="true"
          (onClick)="cerrarSesion()"
        />
      </div>
    </section>
  } @else {
    <div class="rounded-3xl border border-olive/15 bg-white p-10 text-center shadow-md">
      <i class="pi pi-exclamation-triangle text-2xl text-text/30" aria-hidden="true"></i>
      <p class="mt-3 text-text/60">No se pudo cargar tu perfil.</p>
      <p class="mt-1 text-sm text-text/50">{{ s.message }}</p>
    </div>
  }
</div>
