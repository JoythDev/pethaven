@let s = state();

<app-profile-layout>
  @if (s.status === 'loading') {
    @if (skeleton()) {
      <app-skeleton variant="text" [lines]="4" class="col-span-12 @min-[960px]:col-span-4" />
      <app-skeleton variant="text" [lines]="4" class="col-span-12 @min-[960px]:col-span-8" [announce]="false" />
    }
  } @else if (s.status === 'error') {
    <div class="col-span-12 rounded-box border border-line bg-card p-4">
      <app-inline-error [text]="'No se pudo cargar tu perfil. ' + s.message" (retry)="retry()" />
    </div>
  } @else {
    @let owner = s.data;

    <app-profile-header
      class="col-span-12 @min-[960px]:col-span-4"
      [id]="owner.id"
      [name]="owner.name"
      subtitle="Cliente"
    />

    <section app-card heading="Datos personales" class="col-span-12 @min-[960px]:col-span-8">
      <form [formGroup]="form" (ngSubmit)="guardar(owner)" class="flex flex-col gap-4" novalidate>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <app-form-field fieldId="name" label="Nombre" [error]="errorFor('name')">
            <input
              pInputText
              id="name"
              formControlName="name"
              autocomplete="name"
              [attr.aria-invalid]="errorFor('name') ? 'true' : null"
              [attr.aria-describedby]="errorFor('name') ? 'name-error' : null"
            />
          </app-form-field>

          <app-form-field fieldId="document" label="Cédula" hint="La cédula no se puede cambiar.">
            <input
              pInputText
              id="document"
              readonly
              [value]="owner.document"
              class="bg-sunken! border-transparent! text-ink-muted!"
              aria-describedby="document-hint"
            />
          </app-form-field>

          <app-form-field fieldId="email" label="Correo electrónico" hint="El correo no se puede cambiar.">
            <input
              pInputText
              id="email"
              type="email"
              readonly
              [value]="owner.email"
              class="bg-sunken! border-transparent! text-ink-muted!"
              aria-describedby="email-hint"
            />
          </app-form-field>

          <app-form-field fieldId="phone" label="Teléfono" [error]="errorFor('phone')">
            <input
              pInputText
              id="phone"
              type="tel"
              inputmode="tel"
              formControlName="phone"
              autocomplete="tel"
              [attr.aria-invalid]="errorFor('phone') ? 'true' : null"
              [attr.aria-describedby]="errorFor('phone') ? 'phone-error' : null"
            />
          </app-form-field>
        </div>

        <div class="flex justify-end">
          <button pButton id="btnGuardar" type="submit" label="Guardar cambios" [loading]="saving()"></button>
        </div>
      </form>
    </section>
  }

  <app-profile-appearance-card class="col-span-12 @min-[960px]:col-span-4" />
  <app-profile-security-card class="col-span-12 @min-[960px]:col-span-8" [savePassword]="savePassword()" />
</app-profile-layout>
