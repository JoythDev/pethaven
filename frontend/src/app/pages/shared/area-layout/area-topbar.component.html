<header
  class="sticky top-3 z-20 mx-3 mt-3 flex h-16 before:absolute before:-top-3 before:-left-3 before:-right-3 before:-z-10 before:h-3 before:bg-background items-center gap-3 rounded-3xl border border-olive/15 bg-white/90 px-4 shadow-lg shadow-tertiary/10 backdrop-blur lg:px-6"
>
  <p-button
    icon="pi pi-bars"
    severity="secondary"
    [text]="true"
    ariaLabel="Abrir menú"
    styleClass="lg:hidden"
    (onClick)="menuToggle.emit()"
  />

  <p-breadcrumb
    class="min-w-0"
    [model]="breadcrumbItems()"
    [home]="homeItem()"
    styleClass="border-none bg-transparent"
  />

  <div class="ml-auto flex shrink-0 items-center gap-3">
    @if (userName()) {
      <p class="hidden font-display text-base font-bold text-text sm:block">
        Hola, <span class="text-tertiary">{{ firstName() }}</span>
      </p>
    }
    <button
      type="button"
      (click)="userMenu.toggle($event)"
      class="cursor-pointer rounded-full ring-2 ring-honey ring-offset-2 ring-offset-white transition hover:ring-terracotta focus-visible:outline-none focus-visible:ring-tertiary"
      aria-haspopup="true"
      aria-label="Menú de usuario"
    >
      @if (photoUrl(); as photo) {
        <p-avatar [image]="photo" shape="circle" size="large" (onImageError)="failedPhotoUrl.set(photo)" />
      } @else {
        <p-avatar
          [label]="userInitial()"
          shape="circle"
          size="large"
          styleClass="bg-secondary font-display font-bold text-tertiary"
        />
      }
    </button>
    <p-menu #userMenu [model]="userMenuItems()" [popup]="true" appendTo="body" />
  </div>
</header>
