<div class="relative isolate flex min-h-screen overflow-clip bg-background text-text font-body">
  @let config = layoutConfig();

  <!-- Blobs decorativos fijos detrás del contenido -->
  <span aria-hidden="true" class="blob pointer-events-none fixed -right-32 top-20 -z-10 aspect-square w-[26rem] bg-secondary opacity-50"></span>
  <span aria-hidden="true" class="blob blob-alt pointer-events-none fixed -bottom-32 left-72 -z-10 aspect-square w-[30rem] bg-honey opacity-20"></span>

  <!-- Sidebar (desktop) -->
  <aside class="hidden w-64 shrink-0 p-3 pr-0 lg:block">
    <div
      class="sticky top-3 h-[calc(100vh-1.5rem)] overflow-hidden rounded-3xl border border-olive/15 bg-white shadow-lg shadow-tertiary/10"
    >
      <app-area-sidebar
        [items]="config.sidebar.items"
        [homeLink]="config.sidebar.homeLink"
        [sectionLabel]="config.sidebar.sectionLabel"
      />
    </div>
  </aside>

  <!-- Contenido -->
  <div class="flex min-w-0 flex-1 flex-col">
    <app-area-topbar
      class="contents"
      [homeItem]="config.topbar.homeItem"
      [pageLabels]="config.topbar.pageLabels"
      [subPageLabels]="config.topbar.subPageLabels"
      [userName]="config.topbar.userName"
      [userInitial]="config.topbar.userInitial"
      [userPhotoUrl]="config.topbar.userPhotoUrl ?? null"
      [userMenuItems]="config.topbar.userMenuItems"
      [skipNumericSegment]="config.topbar.skipNumericSegment"
      (menuToggle)="mobileMenuVisible.set(true)"
    />
    <main class="min-w-0 flex-1">
      <router-outlet />
    </main>
  </div>

  <!-- Sidebar (móvil) -->
  <p-drawer [(visible)]="mobileMenuVisible" position="left" [style]="{ width: '16rem' }">
    <div class="-m-5 h-full">
      <app-area-sidebar
        [items]="config.sidebar.items"
        [homeLink]="config.sidebar.homeLink"
        [sectionLabel]="config.sidebar.sectionLabel"
        (itemClicked)="mobileMenuVisible.set(false)"
      />
    </div>
  </p-drawer>

  <!-- Feedback global del panel -->
  <p-toast position="top-right" styleClass="top-[5.75rem]! max-sm:left-4! max-sm:right-4! max-sm:w-auto!" />
  <p-confirmdialog />
</div>
