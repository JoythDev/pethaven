@if (showPhoto()) {
  <img [src]="photoUrl()" [alt]="'Foto de ' + name()" class="absolute inset-0 size-full object-cover" (error)="onPhotoError()" />
} @else if (kind() === 'person') {
  <span aria-hidden="true">{{ initials() }}</span>
  <span class="sr-only">{{ name() }}</span>
} @else {
  <app-sticker [name]="sticker()" [width]="size()" [kit]="kit()" [head]="true" />
  <span class="sr-only">{{ name() }}</span>
}
