<ng-template #body>
  <span class="grid size-8 shrink-0 place-items-center rounded-full bg-sunken text-ink">
    <svg [lucideIcon]="icon()" [size]="16" aria-hidden="true"></svg>
  </span>
  <span class="min-w-0 flex-1">
    <span [class]="titleClass()">{{ notification().title }}</span>
    @if (showDetail()) {
      <span [class]="detailClass()">{{ notification().detail }}</span>
    }
    @if (!isPage()) {
      <span class="block text-[12.5px] leading-[18px] text-ink-muted">{{ time() }}</span>
    }
  </span>
  @if (isPage()) {
    <span class="shrink-0 text-[12.5px] leading-5 whitespace-nowrap text-ink-muted">{{ time() }}</span>
    <span class="mt-[6px] grid size-2 shrink-0 place-items-center">
      @if (notification().unread) {
        <span class="size-2 rounded-full bg-accent"></span>
        <span class="sr-only">Sin leer</span>
      }
    </span>
  }
</ng-template>

@if (interactive()) {
  <button type="button" [class]="rowClass()" (click)="activate.emit()">
    <ng-container *ngTemplateOutlet="body" />
  </button>
} @else {
  <div [class]="rowClass()"><ng-container *ngTemplateOutlet="body" /></div>
}
