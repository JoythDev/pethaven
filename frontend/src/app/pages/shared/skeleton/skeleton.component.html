@if (announce()) {
  <span class="sr-only">Cargando…</span>
}

<div class="contents" aria-hidden="true">
  @switch (variant()) {
    @case ('text') {
      <p-skeleton class="block w-[42%]" height="16px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
      <div class="mt-4 flex flex-col gap-2.5">
        @for (width of textLines(); track $index) {
          <p-skeleton class="block" [style.width]="width" height="11px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
        }
      </div>
    }
    @case ('row') {
      <p-skeleton class="block shrink-0" shape="circle" size="32px" animation="none" styleClass="ph-skeleton-bar" />
      <div class="flex min-w-0 flex-1 flex-col gap-2">
        <p-skeleton class="block w-[55%]" height="11px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
        <p-skeleton class="block w-[34%]" height="11px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
      </div>
      <p-skeleton class="block w-14 shrink-0" height="20px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
    }
    @case ('media') {
      <p-skeleton class="block" height="118px" [borderRadius]="radiusBlock" animation="none" styleClass="ph-skeleton-bar" />
      <div class="px-3.5 py-3">
        <p-skeleton class="block w-[42%]" height="16px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
        <div class="mt-3.5 flex flex-col gap-2.5">
          <p-skeleton class="block w-[92%]" height="11px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
          <p-skeleton class="block w-[60%]" height="11px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
        </div>
      </div>
    }
    @case ('figure') {
      <div class="flex h-[18px] items-center">
        <p-skeleton class="block w-[38%]" height="11px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
      </div>
      <p-skeleton class="mt-1.5 block w-[62%]" height="28px" [borderRadius]="radiusBar" animation="none" styleClass="ph-skeleton-bar" />
      <div class="mt-auto pt-2">
        <div class="flex h-[18px] items-center">
          <p-skeleton class="block w-[48%]" height="11px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
        </div>
      </div>
    }
    @case ('chart') {
      <p-skeleton class="block w-[42%]" height="16px" [borderRadius]="radiusFull" animation="none" styleClass="ph-skeleton-bar" />
      <div class="mt-5 flex h-[124px] items-end gap-3 border-b border-line">
        @for (height of chartBars; track $index) {
          <p-skeleton class="block min-w-0 flex-1" [height]="height + 'px'" [borderRadius]="radiusBar" animation="none" styleClass="ph-skeleton-bar" />
        }
      </div>
    }
  }
</div>
