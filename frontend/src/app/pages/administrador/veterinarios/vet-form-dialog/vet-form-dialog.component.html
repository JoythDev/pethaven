<p-dialog
  [visible]="true"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [closeOnEscape]="true"
  [blockScroll]="true"
  appendTo="body"
  [header]="title()"
  closeAriaLabel="Cerrar"
  styleClass="w-[min(34rem,calc(100vw-2rem))]"
  [focusOnShow]="false"
  (onShow)="focusName()"
  (visibleChange)="$event ? null : requestClose()"
>
  @if (loading()) {
    @if (skeleton()) {
      <app-skeleton variant="text" [lines]="4" />
    }
  } @else {
    <form id="vet-form" [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-4" novalidate>
      <app-form-field fieldId="name" label="Nombre completo" [error]="errorFor('name')">
        <input
          pInputText
          id="name"
          formControlName="name"
          autocomplete="off"
          [attr.aria-invalid]="errorFor('name') ? 'true' : null"
          [attr.aria-describedby]="errorFor('name') ? 'name-error' : null"
        />
      </app-form-field>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <app-form-field fieldId="document" label="Cédula" [error]="errorFor('document')">
          <input
            pInputText
            id="document"
            formControlName="document"
            autocomplete="off"
            inputmode="numeric"
            [attr.aria-invalid]="errorFor('document') ? 'true' : null"
            [attr.aria-describedby]="errorFor('document') ? 'document-error' : null"
          />
        </app-form-field>

        <app-form-field fieldId="specialty" label="Especialidad" [error]="errorFor('specialty')">
          <input
            pInputText
            id="specialty"
            formControlName="specialty"
            autocomplete="off"
            [attr.aria-invalid]="errorFor('specialty') ? 'true' : null"
            [attr.aria-describedby]="errorFor('specialty') ? 'specialty-error' : null"
          />
        </app-form-field>
      </div>

      <!-- El id emailError lo usan las pruebas de Selenium: solo existe mientras hay un error de correo. -->
      <app-form-field
        fieldId="email"
        label="Correo"
        [error]="errorFor('email')"
        [attr.id]="errorFor('email') ? 'emailError' : null"
      >
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="off"
          [attr.aria-invalid]="errorFor('email') ? 'true' : null"
          [attr.aria-describedby]="errorFor('email') ? 'email-error' : null"
        />
      </app-form-field>

      <app-form-field
        fieldId="password"
        label="Contraseña"
        [optional]="editing()"
        [error]="errorFor('password')"
        [hint]="editing() ? 'Déjala vacía para conservar la actual.' : 'Mínimo 8 caracteres.'"
      >
        <div class="relative">
          <input
            pInputText
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            class="w-full pr-12"
            [attr.aria-invalid]="errorFor('password') ? 'true' : null"
            [attr.aria-describedby]="errorFor('password') ? 'password-error' : 'password-hint'"
          />
          <button
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword()"
            [pTooltip]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            tooltipPosition="top"
            class="ph-focus absolute top-1 right-1 grid size-[30px] cursor-pointer place-items-center rounded-control text-ink-muted transition-colors duration-[180ms] hover:bg-sunken hover:text-ink motion-reduce:transition-none"
          >
            @if (showPassword()) {
              <svg lucideEyeOff [size]="18" aria-hidden="true"></svg>
            } @else {
              <svg lucideEye [size]="18" aria-hidden="true"></svg>
            }
          </button>
        </div>
      </app-form-field>

      <app-form-field fieldId="photoUrl" label="Foto (URL)" [optional]="true" [error]="errorFor('photoUrl')">
        <input
          pInputText
          id="photoUrl"
          type="url"
          formControlName="photoUrl"
          autocomplete="off"
          placeholder="https://…"
          [attr.aria-invalid]="errorFor('photoUrl') ? 'true' : null"
          [attr.aria-describedby]="errorFor('photoUrl') ? 'photoUrl-error' : null"
        />
      </app-form-field>
    </form>
  }

  <ng-template #footer>
    <div class="flex flex-wrap justify-end gap-2">
      <button pButton type="button" severity="secondary" [outlined]="true" label="Cancelar" (click)="requestClose()"></button>
      <button
        pButton
        id="btnGuardar"
        type="submit"
        form="vet-form"
        [label]="editing() ? 'Guardar cambios' : 'Guardar veterinario'"
        [loading]="saving()"
        [disabled]="loading()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
