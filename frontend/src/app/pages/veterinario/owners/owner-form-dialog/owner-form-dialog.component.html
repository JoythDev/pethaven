<p-dialog
  [visible]="true"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [closeOnEscape]="true"
  [blockScroll]="true"
  appendTo="body"
  [header]="title()"
  closeAriaLabel="Cerrar"
  styleClass="w-[min(34rem,calc(100vw-2rem))]"
  [focusOnShow]="false"
  (onShow)="focusName()"
  (visibleChange)="$event ? null : requestClose()"
>
  @if (step() === 'form') {
    @if (loading()) {
      @if (skeleton()) {
        <app-skeleton variant="text" [lines]="4" />
      }
    } @else {
      <form id="owner-form" [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-4" novalidate>
        <app-form-field fieldId="name" label="Nombre completo" [error]="errorFor('name')">
          <input
            pInputText
            id="name"
            formControlName="name"
            autocomplete="off"
            [attr.aria-invalid]="errorFor('name') ? 'true' : null"
            [attr.aria-describedby]="errorFor('name') ? 'name-error' : null"
          />
        </app-form-field>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <app-form-field fieldId="document" label="Cédula" [error]="errorFor('document')">
            <input
              pInputText
              id="document"
              formControlName="document"
              autocomplete="off"
              inputmode="numeric"
              [attr.aria-invalid]="errorFor('document') ? 'true' : null"
              [attr.aria-describedby]="errorFor('document') ? 'document-error' : null"
            />
          </app-form-field>

          <app-form-field fieldId="phone" label="Teléfono" [error]="errorFor('phone')">
            <input
              pInputText
              id="phone"
              type="tel"
              formControlName="phone"
              autocomplete="off"
              [attr.aria-invalid]="errorFor('phone') ? 'true' : null"
              [attr.aria-describedby]="errorFor('phone') ? 'phone-error' : null"
            />
          </app-form-field>
        </div>

        <!-- El id emailError lo usan las pruebas de Selenium: solo existe mientras hay un error de correo. -->
        <app-form-field
          fieldId="email"
          label="Correo"
          [error]="errorFor('email')"
          [attr.id]="errorFor('email') ? 'emailError' : null"
        >
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            autocomplete="off"
            [attr.aria-invalid]="errorFor('email') ? 'true' : null"
            [attr.aria-describedby]="errorFor('email') ? 'email-error' : null"
          />
        </app-form-field>

        <app-form-field
          fieldId="password"
          label="Contraseña"
          [optional]="editing()"
          [error]="errorFor('password')"
          [hint]="editing() ? 'Déjala vacía para conservar la contraseña actual.' : null"
        >
          <div class="relative">
            <input
              pInputText
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              class="w-full pr-12"
              [attr.aria-invalid]="errorFor('password') ? 'true' : null"
              [attr.aria-describedby]="errorFor('password') ? 'password-error' : editing() ? 'password-hint' : null"
            />
            <button
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.aria-pressed]="showPassword()"
              [pTooltip]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              tooltipPosition="top"
              class="ph-focus absolute top-1 right-1 grid size-[30px] cursor-pointer place-items-center rounded-control text-ink-muted transition-colors duration-[180ms] hover:bg-sunken hover:text-ink motion-reduce:transition-none"
            >
              @if (showPassword()) {
                <svg lucideEyeOff [size]="18" aria-hidden="true"></svg>
              } @else {
                <svg lucideEye [size]="18" aria-hidden="true"></svg>
              }
            </button>
          </div>
        </app-form-field>
      </form>
    }
  } @else {
    <!-- Confirmación en el mismo diálogo (11.12): el aviso se lee solo, sin mover el foco antes de tiempo. -->
    <div class="flex flex-col items-center gap-3 py-2 text-center" role="status">
      <app-sticker name="heart" [width]="96" />
      <p class="text-sm leading-5 text-ink-muted">Guardamos los datos de {{ savedOwner()?.name }}.</p>
      <h3 class="font-display text-[17px] leading-[22px] font-semibold text-balance text-ink">
        ¿Desea registrar una mascota para este dueño?
      </h3>
    </div>
  }

  <ng-template #footer>
    <div class="flex flex-wrap justify-end gap-2">
      @if (step() === 'form') {
        <button pButton type="button" severity="secondary" [outlined]="true" label="Cancelar" (click)="requestClose()"></button>
        <button
          pButton
          id="btnGuardar"
          type="submit"
          form="owner-form"
          [label]="editing() ? 'Guardar cambios' : 'Guardar dueño'"
          [loading]="saving()"
          [disabled]="loading()"
        ></button>
      } @else {
        <button pButton type="button" severity="secondary" [outlined]="true" label="Más tarde" (click)="later()"></button>
        <button pButton id="btnRegistrarMascota" type="button" label="Registrar" (click)="registerPet()"></button>
      }
    </div>
  </ng-template>
</p-dialog>
