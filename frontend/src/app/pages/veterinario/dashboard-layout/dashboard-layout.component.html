<div class="min-h-screen flex bg-background text-text font-body">
  <!-- Sidebar (desktop) -->
  <aside class="hidden lg:block w-60 shrink-0 border-r border-olive/15 bg-white">
    <div class="sticky top-0 h-screen">
      <app-dashboard-sidebar />
    </div>
  </aside>

  <!-- Contenido -->
  <div class="flex-1 min-w-0 flex flex-col">
    <app-dashboard-topbar (menuToggle)="mobileMenuVisible.set(true)" />
    <main class="flex-1 min-w-0">
      <router-outlet />
    </main>
  </div>

  <!-- Sidebar (móvil) -->
  <p-drawer [(visible)]="mobileMenuVisible" position="left" [style]="{ width: '15rem' }">
    <div class="-m-5">
      <app-dashboard-sidebar (itemClicked)="mobileMenuVisible.set(false)" />
    </div>
  </p-drawer>

  <!-- Feedback global del panel -->
  <p-toast position="top-right" />
  <p-confirmdialog />
</div>
