<!-- La línea vertical y los marcadores van a la izquierda; cada año es una lista con su encabezado. -->
<div class="relative pl-6 before:absolute before:top-2 before:bottom-2 before:left-[6px] before:w-0.5 before:bg-line before:content-['']">
  @for (group of groups(); track group.year) {
    <h3 class="mt-2.5 mb-1 font-display text-[15px] leading-5 font-semibold text-ink-muted first:mt-0">{{ group.year }}</h3>
    <ul class="m-0 flex list-none flex-col gap-0.5 p-0">
      @for (treatment of group.items; track treatment.id) {
        <li class="relative">
          <button
            type="button"
            class="ph-focus relative flex w-full min-w-0 items-center gap-2.5 rounded-row px-3 py-2.5 text-left text-ink transition-colors duration-[180ms] ease-out-strong motion-reduce:transition-none"
            [class]="selectedId() === treatment.id ? 'bg-accent-soft' : 'hover:bg-sunken'"
            [attr.aria-pressed]="selectedId() === treatment.id"
            (click)="selectTreatment.emit(treatment)"
          >
            <span
              class="absolute top-1/2 -left-6 -mt-[7px] size-3.5 rounded-full border-[3px] border-card"
              [class]="marker(treatment)"
              aria-hidden="true"
            ></span>
            <time class="w-[3.25rem] shrink-0 text-[12.5px] leading-[18px] font-extrabold text-ink-muted" [attr.datetime]="treatment.date">
              {{ treatment.date | date: 'd MMM' }}
            </time>
            <span class="min-w-0 flex-1">
              <span class="block text-sm leading-5 font-extrabold break-words">{{ treatment.diagnosis }}</span>
              <span class="block truncate text-[12.5px] leading-[18px] text-ink-muted">
                {{ treatment.veterinarianName }} · {{ drugCount(treatment) }}
              </span>
            </span>
            <p-tag class="shrink-0" [severity]="evolutionSeverity(treatment.evolution)" [value]="evolutionLabel(treatment.evolution)" />
          </button>
        </li>
      }
    </ul>
  }
</div>

@if (toggleText(); as text) {
  <p-button
    class="mt-2 block"
    [text]="true"
    size="small"
    [label]="text"
    [attr.aria-expanded]="expanded()"
    (onClick)="toggle.emit()"
  />
}
