# Perfil de pruebas: base H2 en memoria compartida por todas las pruebas @SpringBootTest
# (una sola configuración permite que Spring reutilice el mismo contexto entre clases).
# No toca el archivo ./pethaven-database de la aplicación.
spring.datasource.url=jdbc:h2:mem:pethaven-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Sin consola H2 ni logs SQL detallados durante las pruebas.
spring.h2.console.enabled=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
spring.jpa.properties.hibernate.format_sql=false
