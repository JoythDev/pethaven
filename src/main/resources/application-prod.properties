# Se activa solo con SPRING_PROFILES_ACTIVE=prod, que se define en el servidor desplegado, nunca en local.
# Variables de entorno que el servidor debe tener: JWT_SECRET, CORS_ALLOWED_ORIGINS (URL del frontend),
# ADMIN_EMAIL y ADMIN_PASSWORD (administrador inicial), BREVO_API_KEY y BREVO_SENDER_EMAIL (envio del codigo
# de verificacion; BREVO_SENDER_NAME es opcional). PORT lo inyecta Render. Opcionales, para la demostracion:
# DEMO_VET_EMAIL, DEMO_OWNER_EMAIL, DEMO_OWNER2_EMAIL (correos reales de las cuentas de ejemplo) y DEMO_PASSWORD. Opcionales, para la demostracion:
# DEMO_VET_EMAIL, DEMO_OWNER_EMAIL, DEMO_OWNER2_EMAIL (correos reales de las cuentas de ejemplo) y DEMO_PASSWORD.
# Perfil de produccion (demo): H2 en memoria, sin consola H2, sin log SQL ni documentacion publica del API.
# La base se recrea en cada arranque y DataLoader vuelve a cargar los datos de ejemplo.
spring.datasource.url=jdbc:h2:mem:pethaven
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# Secretos y origenes obligatorios: sin valor por defecto, la aplicacion no arranca si faltan.
security.jwt.secret-key=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# El codigo de verificacion siempre sale por correo: nunca por el log.
app.otp.mail.provider=brevo

# Sin los administradores de ejemplo (correo ficticio y contrasena publica): el unico es el de ADMIN_EMAIL.
app.demo.sample-admins=false

# Sin los administradores de ejemplo (correo ficticio y contrasena publica): el unico es el de ADMIN_EMAIL.
app.demo.sample-admins=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
