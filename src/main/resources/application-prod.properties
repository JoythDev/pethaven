# Se activa solo con SPRING_PROFILES_ACTIVE=prod, que se define en el servidor desplegado, nunca en local.
# Variables de entorno que el servidor debe tener: JWT_SECRET, CORS_ALLOWED_ORIGINS (URL del frontend),
# ADMIN_EMAIL y ADMIN_PASSWORD (administrador inicial). PORT lo inyecta Render.
# Perfil de produccion (demo): H2 en memoria, sin consola H2, sin log SQL ni documentacion publica del API.
# La base se recrea en cada arranque y DataLoader vuelve a cargar los datos de ejemplo.
spring.datasource.url=jdbc:h2:mem:pethaven
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# Secretos y origenes obligatorios: sin valor por defecto, la aplicacion no arranca si faltan.
security.jwt.secret-key=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
