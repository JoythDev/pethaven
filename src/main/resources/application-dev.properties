# Perfil de desarrollo: base H2 en archivo, consola H2 y log SQL.
spring.datasource.url=jdbc:h2:file:./pethaven-database
spring.datasource.username=sa
spring.datasource.password=

#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8080/h2
spring.h2.console.path=/h2

#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=create-drop

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imrime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true
