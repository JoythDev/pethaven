spring.application.name=pethaven-backend

# Spring carga este archivo siempre y, ademas, application-{perfil}.properties del perfil activo.
# El perfil se elige con la variable de entorno SPRING_PROFILES_ACTIVE:
#   - sin definirla, aplica el perfil por defecto "dev" (desarrollo local);
#   - SPRING_PROFILES_ACTIVE=prod se define solo en el servidor desplegado (Render o el contenedor Docker).
spring.profiles.default=dev

# Puerto: Render y otros hosts lo inyectan con PORT
server.port=${PORT:8080}

# Datos de prueba
spring.jpa.generate-ddl=true
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver

# CORS
# Origenes permitidos (lista separada por comas). En produccion se define CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT
# Clave HMAC en Base64 (minimo 256 bits). En produccion se define JWT_SECRET sin valor por defecto:
# el valor de respaldo es solo para desarrollo y pruebas.
security.jwt.secret-key=${JWT_SECRET:AU+kvqDxSr5S9+D6UIYJxtJ/Lrt/DFv3UNnBmDwrATDOoGnGAUD21BjFbbVejJNUwqOgk8jXWfmXnzhvmOTItg==}
# Vigencia del token de acceso en milisegundos (2 horas, sin token de refresco).
security.jwt.expiration-time=${JWT_EXPIRATION_MS:7200000}

# Administrador inicial: lo crea SecuritySeeder solo si no existe ningun administrador.
# Sin ADMIN_EMAIL ni ADMIN_PASSWORD no se crea (desarrollo y pruebas); en produccion se definen ambas.
app.seed.admin.name=${ADMIN_NAME:Administrador}
app.seed.admin.email=${ADMIN_EMAIL:}
app.seed.admin.password=${ADMIN_PASSWORD:}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger UI
springdoc.paths-to-match=/api/owners/**,/api/pets/**,/api/veterinarians/**,/api/drugs/**,/api/treatments/**,/api/administrators/**,/api/auth/**
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
