spring.application.name=pethaven-backend

# Spring carga este archivo siempre y, ademas, application-{perfil}.properties del perfil activo.
# El perfil se elige con la variable de entorno SPRING_PROFILES_ACTIVE:
#   - sin definirla, aplica el perfil por defecto "dev" (desarrollo local);
#   - SPRING_PROFILES_ACTIVE=prod se define solo en el servidor desplegado (Render o el contenedor Docker).
spring.profiles.default=dev

# Puerto: Render y otros hosts lo inyectan con PORT
server.port=${PORT:8080}

# Datos de prueba
spring.jpa.generate-ddl=true
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver

# CORS
# Origenes permitidos (lista separada por comas). En produccion se define CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT
# Clave HMAC en Base64 (minimo 256 bits). En produccion se define JWT_SECRET sin valor por defecto:
# el valor de respaldo es solo para desarrollo y pruebas.
security.jwt.secret-key=${JWT_SECRET:AU+kvqDxSr5S9+D6UIYJxtJ/Lrt/DFv3UNnBmDwrATDOoGnGAUD21BjFbbVejJNUwqOgk8jXWfmXnzhvmOTItg==}
# Vigencia del token de acceso en milisegundos (2 horas, sin token de refresco).
security.jwt.expiration-time=${JWT_EXPIRATION_MS:7200000}

# Segundo factor del inicio de sesion: codigo de un solo uso enviado por correo.
# provider=log escribe el codigo en el log (desarrollo y pruebas); provider=brevo lo envia por correo (produccion).
app.otp.mail.provider=${OTP_MAIL_PROVIDER:log}
app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-resends=3
app.otp.brevo.api-key=${BREVO_API_KEY:}
app.otp.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.otp.brevo.sender-name=${BREVO_SENDER_NAME:PetHaven}

# Cuentas de demostracion con correo real (el codigo de verificacion llega a esa bandeja). Sin valor, cada
# cuenta conserva su correo de ejemplo. app.demo.password cambia la contrasena de esas tres cuentas.
app.demo.owner-email=${DEMO_OWNER_EMAIL:}
app.demo.owner2-email=${DEMO_OWNER2_EMAIL:}
app.demo.vet-email=${DEMO_VET_EMAIL:}
app.demo.password=${DEMO_PASSWORD:}
app.demo.sample-admins=true

# Cuentas de demostracion con correo real (el codigo de verificacion llega a esa bandeja). Sin valor, cada
# cuenta conserva su correo de ejemplo. app.demo.password cambia la contrasena de esas tres cuentas.
app.demo.owner-email=${DEMO_OWNER_EMAIL:}
app.demo.owner2-email=${DEMO_OWNER2_EMAIL:}
app.demo.vet-email=${DEMO_VET_EMAIL:}
app.demo.password=${DEMO_PASSWORD:}
app.demo.sample-admins=true

# Administrador inicial: lo crea SecuritySeeder solo si no existe ningun administrador.
# Sin ADMIN_EMAIL ni ADMIN_PASSWORD no se crea (desarrollo y pruebas); en produccion se definen ambas.
app.seed.admin.name=${ADMIN_NAME:Administrador}
app.seed.admin.email=${ADMIN_EMAIL:}
app.seed.admin.password=${ADMIN_PASSWORD:}

# Horario de atencion para citas (hora local de la clinica). Un dia sin entrada en hours esta cerrado.
app.clinic.zone=America/Bogota
app.clinic.slot-minutes=30
app.clinic.hours.monday=08:00-17:00
app.clinic.hours.tuesday=08:00-17:00
app.clinic.hours.wednesday=08:00-17:00
app.clinic.hours.thursday=08:00-17:00
app.clinic.hours.friday=08:00-17:00
app.clinic.hours.saturday=08:00-13:00
# Datos de la sede que muestra la tarjeta "Tu clinica" (GET /api/clinic).
app.clinic.name=${CLINIC_NAME:PetHaven Chapinero}
app.clinic.address=${CLINIC_ADDRESS:Calle 63 n.\u00ba 9-41}
app.clinic.phone=${CLINIC_PHONE:601 555 0123}
# Ventana de reserva del dueno: dias hacia adelante (hoy incluido) y antelacion minima en horas.
app.clinic.booking-days=14
app.clinic.min-notice-hours=2

# Recordatorio de citas: cada dia a las 18:00 (hora de la clinica) avisa por correo las citas del dia siguiente.
# Usa el mismo proveedor de correo que el codigo de inicio de sesion (app.otp.mail.provider). "-" lo desactiva.
app.appointments.reminder-cron=${APPOINTMENT_REMINDER_CRON:0 0 18 * * *}

# Avisos de citas: dominios a los que nunca se envia correo (las cuentas de ejemplo usan example.com).
app.mail.suppressed-domains=${MAIL_SUPPRESSED_DOMAINS:example.com}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger UI
springdoc.paths-to-match=/api/appointments/**,/api/clinic/**,/api/owners/**,/api/pets/**,/api/veterinarians/**,/api/drugs/**,/api/treatments/**,/api/administrators/**,/api/auth/**
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
