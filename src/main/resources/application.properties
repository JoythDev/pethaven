spring.application.name=pethaven-backend

#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver

#nombre base de datos
spring.datasource.url=jdbc:h2:file:./pethaven-database
spring.datasource.username=sa
spring.datasource.password=

#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8080/h2
spring.h2.console.path=/h2

# Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=create-drop
#spring.sql.init.mode=

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imrime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true

# CORS
# Origenes permitidos (lista separada por comas). En produccion se define CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT
# Clave HMAC en Base64 (minimo 256 bits). En produccion se define JWT_SECRET sin valor por defecto:
# el valor de respaldo es solo para desarrollo y pruebas.
security.jwt.secret-key=${JWT_SECRET:AU+kvqDxSr5S9+D6UIYJxtJ/Lrt/DFv3UNnBmDwrATDOoGnGAUD21BjFbbVejJNUwqOgk8jXWfmXnzhvmOTItg==}
# Vigencia del token de acceso en milisegundos (2 horas, sin token de refresco).
security.jwt.expiration-time=${JWT_EXPIRATION_MS:7200000}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger UI
springdoc.paths-to-match=/api/owners/**,/api/pets/**,/api/veterinarians/**,/api/drugs/**,/api/treatments/**,/api/administrators/**,/api/auth/**
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha