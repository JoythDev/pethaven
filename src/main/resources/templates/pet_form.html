<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

  <head th:replace="~{fragments :: head}"></head>

  <body class="bg-background text-text font-body min-h-screen flex flex-col">

    <div th:replace="~{fragments :: header}"></div>

    <main class="flex-1 max-w-2xl mx-auto px-5 lg:px-12 py-10 lg:py-16 w-full">

      <div class="mb-8">
        <a th:href="@{/pets}" class="text-sm font-semibold text-primary hover:text-tertiary transition-colors">
          ← Volver a Mis Mascotas
        </a>
      </div>

      <h1 class="font-display text-3xl font-bold mb-8"
          th:text="${pet.id == null} ? 'Registrar Nueva Mascota' : 'Editar Mascota'">
        Registrar Nueva Mascota
      </h1>

      <div class="bg-white rounded-[2rem] p-6 lg:p-8 shadow-sm">
        <form method="POST"
              th:action="${pet.id == null} ? @{/pets/add} : @{/pets/update/{id}(id=${pet.id})}"
              th:object="${pet}"
              class="flex flex-col gap-5">

          <!-- Nombre -->
          <div class="flex flex-col gap-1">
            <label for="name" class="text-sm font-bold">Nombre</label>
            <input type="text" id="name" th:field="*{name}" required
                   class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
          </div>

          <!-- Dueño -->
          <div class="flex flex-col gap-1">
            <label for="owner" class="text-sm font-bold">Dueño</label>
            <select id="owner" th:field="*{ownerId}" required
                    class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
              <option value="" disabled>Selecciona un dueño</option>
              <option th:each="owner : ${owners}" th:value="${owner.id}" th:text="${owner.name}"></option>
            </select>
          </div>

          <!-- Especie -->
          <div class="flex flex-col gap-1">
            <label for="species" class="text-sm font-bold">Especie</label>
            <select id="species" th:field="*{species}" required
                    class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
              <option value="" disabled>Selecciona una especie</option>
              <option value="DOG">Perro</option>
              <option value="CAT">Gato</option>
            </select>
          </div>

          <!-- Raza -->
          <div class="flex flex-col gap-1">
            <label for="breed" class="text-sm font-bold">Raza</label>
            <input type="text" id="breed" th:field="*{breed}" required
                   class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
          </div>

          <!-- Edad y peso en la misma fila -->
          <div class="grid grid-cols-2 gap-5">
            <div class="flex flex-col gap-1">
              <label for="age" class="text-sm font-bold">Edad (años)</label>
              <input type="number" id="age" th:field="*{age}" min="0" required
                     class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
            </div>
            <div class="flex flex-col gap-1">
              <label for="weight" class="text-sm font-bold">Peso (kg)</label>
              <input type="number" id="weight" th:field="*{weight}" min="0" step="0.1" required
                     class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
            </div>
          </div>

          <!-- Diagnóstico -->
          <div class="flex flex-col gap-1">
            <label for="disease" class="text-sm font-bold">Diagnóstico</label>
            <input type="text" id="disease" th:field="*{disease}" placeholder="Escribe 'None' si no tiene ninguno"
                   class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
          </div>

          <!-- URL de la foto -->
          <div class="flex flex-col gap-1">
            <label for="photoUrl" class="text-sm font-bold">URL de la foto</label>
            <input type="url" id="photoUrl" th:field="*{photoUrl}" placeholder="https://..." required
                   class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
          </div>

          <!-- Botones -->
          <div class="flex items-center gap-4 mt-4">
            <button type="submit"
                    class="bg-primary text-background px-6 py-2.5 rounded-full text-sm font-bold shadow-sm hover:opacity-90 transition-opacity cursor-pointer">
              Guardar
            </button>
            <a th:href="@{/pets}" class="text-sm font-bold text-text/60 hover:text-tertiary transition-colors">
              Cancelar
            </a>
          </div>

        </form>
      </div>

    </main>

    <div th:replace="~{fragments :: footer}"></div>
  </body>
</html>
