<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetHaven | Portal Veterinario</title>

  <!-- Mismas fuentes que el resto de PetHaven -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap: usado en el formulario de esta página (igual que login.html) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind: necesario para que el header y footer compartidos (fragments.html) se vean con estilo -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-primary: #a09c6d;
      --color-secondary: #eacecb;
      --color-tertiary: #7a502a;
      --color-text: #261a10;
      --color-background: #f2ece0;
      --color-honey: #e8b04b;
      --color-terracotta: #c96f4a;
      --color-sage: #9db38a;
      --font-display: "Fraunces", serif;
      --font-body: "Nunito Sans", sans-serif;
      --font-script: "Caveat", cursive;

      --animate-float: float 6s ease-in-out infinite alternate;
      --animate-drift: drift 10s ease-in-out infinite alternate;
      --animate-bounce-soft: bounce-soft 2s ease-in-out infinite;
    }
  </style>
  <link rel="stylesheet" th:href="@{/css/style.css}" />

  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.png}">

  <style>
    :root {
      --login-primary: #a09c6d;
      --login-secondary: #eacecb;
      --login-tertiary: #7a502a;
      --login-text: #261a10;
      --login-background: #f2ece0;
      --login-honey: #e8b04b;
    }

    .login-wrapper {
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      position: relative;
      overflow: hidden;
      background-color: var(--login-background);
    }

    /* Manchas decorativas de fondo, con los colores de marca */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
    }
    .blob-1 { width: 320px; height: 320px; background: var(--login-secondary); opacity: 0.6; top: -60px; left: -60px; }
    .blob-2 { width: 280px; height: 280px; background: var(--login-honey); opacity: 0.25; bottom: -70px; right: -70px; }

    .login-card {
      position: relative;
      z-index: 1;
      max-width: 900px;
      width: 100%;
      background: #fff;
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(38, 26, 16, 0.15);
      display: flex;
    }

    .login-visual {
      display: none;
      flex: 1 1 45%;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .login-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(38,26,16,0.7), rgba(38,26,16,0.05));
    }
    .login-visual-text {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      right: 2rem;
      color: #fff;
      z-index: 1;
    }
    @media (min-width: 768px) {
      .login-visual { display: block; }
    }

    .login-form-side {
      flex: 1 1 55%;
      padding: 3rem 2.5rem;
      font-family: "Nunito Sans", sans-serif;
      color: var(--login-text);
    }
    .login-form-side h1 {
      font-family: "Fraunces", serif;
    }

    .form-control-lg:focus {
      border-color: var(--login-primary);
      box-shadow: 0 0 0 0.2rem rgba(160, 156, 109, 0.25);
    }

    .btn-pethaven {
      background-color: var(--login-primary);
      border-color: var(--login-primary);
      color: var(--login-background);
      font-weight: 700;
    }
    .btn-pethaven:hover {
      background-color: var(--login-tertiary);
      border-color: var(--login-tertiary);
      color: var(--login-background);
    }

    /* Bootstrap le pone azul+subrayado a los <a> por defecto; esto
       restaura el estilo normal (heredado) en el header y footer,
       que son compartidos con el resto del sitio (Tailwind) */
    header a,
    footer a,
    #mobile-menu a {
      color: inherit;
      text-decoration: none;
    }
    header a:hover,
    footer a:hover,
    #mobile-menu a:hover {
      opacity: 0.75;
    }

    /* En esta página el menú principal no aplica (los links son anclas
       de la página de inicio) y tampoco tiene sentido "Registrarse" ni
       el botón "Iniciar Sesión": dejamos solo el logo, centrado */
    header nav,
    header a[href="#"],
    header a[href="/login"],
    header button#menu-btn {
      display: none;
    }
    header > div {
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Mismo header/menú que el resto del sitio -->
  <div th:replace="~{fragments :: header}"></div>

  <main class="login-wrapper">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-card">

      <!-- Panel visual, solo visible desde tablet en adelante -->
      <div class="login-visual" th:style="'background-image: url(' + @{/images/instalacion_quirofano.jpg} + ')'">
        <div class="login-visual-text">
          <p class="fw-bold fs-4 mb-1">Portal Veterinario</p>
          <p class="mb-0 opacity-75">Gestiona tratamientos, historiales clínicos e inventario de drogas.</p>
        </div>
      </div>

      <!-- Formulario -->
      <div class="login-form-side">
        <img th:src="@{/images/icons/stethoscope-icon.svg}" alt="" style="height: 32px;" class="mb-3">
        <h1 class="h3 mb-1">Inicio de sesión veterinario</h1>
        <p class="text-muted mb-4">Ingresa con tu correo y contraseña para administrar tus tratamientos.</p>

        <!-- Mensaje de error si el login falla -->
        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

        <form th:action="@{/vet/login}" method="POST">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Correo electrónico</label>
            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="tucorreo@pethaven.com" required>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-pethaven btn-lg w-100 rounded-pill">Iniciar sesión</button>
        </form>

        <p class="text-center text-muted mt-4 mb-0 small">
          ¿Eres dueño de una mascota?
          <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--login-tertiary);">Inicia sesión aquí</a>
        </p>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>

  <!-- Mismo script del sitio: hace funcionar el botón del menú móvil -->
  <script th:src="@{/js/script.js}"></script>

</body>
</html>
