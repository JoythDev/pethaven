<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head}"></head>

  <!-- NOTE: solo existe el formulario de creación; un tratamiento nunca se edita -->
  <body class="bg-background text-text font-body min-h-screen flex flex-col">
    <div th:replace="~{fragments :: header}"></div>

    <div class="flex-1 flex w-full">
      <main class="flex-1 max-w-2xl mx-auto px-5 lg:px-12 py-10 lg:py-16">
        <div class="mb-8">
          <a th:href="@{/treatments}" class="text-sm font-semibold text-primary hover:text-tertiary transition-colors">
            ← Volver a Tratamientos
          </a>
        </div>

        <h1 class="font-display text-3xl font-bold mb-8">Registrar Nuevo Tratamiento</h1>

        <div class="bg-white rounded-[2rem] p-6 lg:p-8 shadow-sm">
          <form method="POST" th:action="@{/treatments/add}" th:object="${treatment}" class="flex flex-col gap-5">

            <!-- Mascota -->
            <div class="flex flex-col gap-1">
              <label for="petId" class="text-sm font-bold">Mascota</label>
              <select id="petId" name="petId" required
                      class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
                <option value="" disabled th:selected="${preselectedPetId == null}">Selecciona una mascota</option>
                <option th:each="pet : ${pets}"
                        th:value="${pet.id}"
                        th:text="${pet.name} + ' (' + (${pet.species?.name() == 'DOG'} ? 'Perro' : 'Gato') + ')'"
                        th:selected="${preselectedPetId != null and preselectedPetId == pet.id}"></option>
              </select>
            </div>

            <!-- Veterinario: solo se listan los activos, igual que exige la lógica de negocio -->
            <div class="flex flex-col gap-1">
              <label for="veterinarianId" class="text-sm font-bold">Veterinario</label>
              <select id="veterinarianId" name="veterinarianId" required
                      class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
                <option value="" disabled selected>Selecciona un veterinario</option>
                <option th:each="veterinarian : ${veterinarians}" th:if="${veterinarian.active}"
                        th:value="${veterinarian.id}"
                        th:text="${veterinarian.name} + ' — ' + ${veterinarian.specialty}"></option>
              </select>
            </div>

            <!-- Fecha -->
            <div class="flex flex-col gap-1">
              <label for="date" class="text-sm font-bold">Fecha y hora</label>
              <input type="datetime-local" id="date" th:field="*{date}" required
                     class="bg-white border border-text/10 text-text px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-primary shadow-sm">
            </div>

            <!-- Botones -->
            <div class="flex items-center gap-4 mt-4">
              <button type="submit"
                      class="bg-primary text-background px-6 py-2.5 rounded-full text-sm font-bold shadow-sm hover:opacity-90 transition-opacity cursor-pointer">
                Guardar
              </button>
              <a th:href="@{/treatments}" class="text-sm font-bold text-text/60 hover:text-tertiary transition-colors">
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </main>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
  </body>
</html>
