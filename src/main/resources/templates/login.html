<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetHaven | Iniciar Sesión</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Mismas fuentes del sitio, para no perder identidad visual -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Nunito Sans", sans-serif;
      background-color: #f2ece0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-family: "Fraunces", serif;
      color: #261a10;
    }
    .btn-pethaven {
      background-color: #a09c6d;
      border-color: #a09c6d;
      color: #f2ece0;
      font-weight: 700;
    }
    .btn-pethaven:hover {
      background-color: #8a8760;
      border-color: #8a8760;
      color: #f2ece0;
    }
  </style>
</head>
<body>

  <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">

      <h1 class="h3 mb-1 text-center">PetHaven</h1>
      <p class="text-center text-muted mb-4">Inicia sesión para ver a tus mascotas</p>

      <!-- Mensaje de error si el login falla -->
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

      <form th:action="@{/login}" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-pethaven w-100 py-2 rounded-pill">Iniciar sesión</button>
      </form>

    </div>
  </div>

</body>
</html>
