<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

  <head th:replace="~{fragments :: head}"></head>

  <body class="bg-background text-text font-body min-h-screen flex flex-col">

    <div th:replace="~{fragments :: header}"></div>

    <div class="flex-1 flex w-full">
      <div th:replace="~{fragments :: sidebar('drugs')}"></div>

      <main class="flex-1 max-w-7xl mx-auto px-5 lg:px-12 py-10 lg:py-16">

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
          <h1 class="font-display text-3xl font-bold">Drogas</h1>

          <a th:href="@{/drugs/add}" class="bg-primary text-background px-5 py-2.5 rounded-full text-sm font-bold shadow-sm hover:opacity-90 transition-opacity flex items-center gap-2">
            <span>+</span> Nueva
          </a>
        </div>

        <div class="bg-white rounded-[2rem] p-6 lg:p-8 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left whitespace-nowrap">

              <thead>
                <tr class="text-text/50 text-sm font-body border-b border-text/10">
                  <th class="pb-4 px-4 font-normal">Droga</th>
                  <th class="pb-4 px-4 font-normal">Precio compra</th>
                  <th class="pb-4 px-4 font-normal">Precio venta</th>
                  <th class="pb-4 px-4 font-normal">Disponibles</th>
                  <th class="pb-4 px-4 font-normal">Vendidas</th>
                  <th class="pb-4 px-4 font-normal">Acciones</th>
                </tr>
              </thead>

              <tbody class="divide-y divide-text/10">
                <tr th:each="drug : ${drugs}" class="border-b border-text/5 hover:bg-background/50 transition-colors group">

                  <td class="py-4 px-4">
                    <a th:href="@{/drugs/{id}(id=${drug.id})}" class="font-bold text-base text-text" th:text="${drug.name}">Amoxicilina</a>
                  </td>
                  <td class="py-4 px-4">
                    <span class="text-sm" th:text="'$' + ${drug.purchasePrice}">$8.000</span>
                  </td>
                  <td class="py-4 px-4">
                    <span class="text-sm" th:text="'$' + ${drug.salePrice}">$15.000</span>
                  </td>
                  <td class="py-4 px-4">
                    <span class="inline-flex items-center bg-primary/20 text-tertiary px-3 py-1 rounded-md text-xs font-bold"
                          th:text="${drug.unitsAvailable}">200</span>
                  </td>
                  <td class="py-4 px-4">
                    <span class="text-sm" th:text="${drug.unitsSold}">0</span>
                  </td>

                  <td class="py-4 px-4">
                    <div class="flex items-center gap-3">
                      <a th:href="@{/drugs/{id}(id=${drug.id})}" class="text-sm font-bold text-primary hover:text-tertiary transition-colors">
                        Ver Ficha
                      </a>
                      <span class="text-text/20">|</span>
                      <a th:href="@{/drugs/update/{id}(id=${drug.id})}" class="text-sm font-bold text-text/60 hover:text-tertiary transition-colors">
                        Editar
                      </a>
                      <span class="text-text/20">|</span>
                      <!-- Si la droga ya fue administrada en algún tratamiento, esto la bloquea (409) -->
                      <a th:href="@{/drugs/delete/{id}(id=${drug.id})}" class="text-sm font-bold text-red-400 hover:text-red-500 transition-colors">
                        Eliminar
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
    <div th:replace="~{fragments :: footer}"></div>
  </body>
</html>
